<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>나만의 워들 게임</title>

    <!-- 외부 CSS 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>WORDLE</h1>

    <p class="description">
        6번의 기회 안에 5글자 영어 단어를 맞혀보세요!
    </p>

    <!-- 게임 메시지 -->
    <div id="message"></div>

    <!-- 워들 게임판 -->
    <div id="game-board"></div>

    <!-- 화면 키보드 -->
    <div id="keyboard"></div>

    <!-- 다시 시작 버튼 -->
    <button id="restart-button">
        다시 시작
    </button>

    <!-- 외부 JavaScript 파일 연결 -->
    <script src="script.js"></script>

</body>
</html>
